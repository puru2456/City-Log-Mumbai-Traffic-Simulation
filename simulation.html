<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityLog — Mumbai Dual-Mode Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; --accent: #FFD700; --panel: #111; --border: #222; 
        }
        * { margin:0; padding:0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg); color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        .nav-bar {
            padding: 1rem 2rem; background: #000; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }
        
        /* New Navigation Link Styles */
        .nav-menu { display: flex; gap: 2rem; align-items: center; }
        .nav-link { 
            color: #666; text-decoration: none; font-size: 0.75rem; font-weight: 700; 
            letter-spacing: 1px; transition: all 0.3s ease; text-transform: uppercase;
        }
        .nav-link:hover { color: var(--accent); }
        .nav-link.active { color: var(--accent); border-bottom: 1px solid var(--accent); }

        .nav-title { font-weight: 800; letter-spacing: 2px; color: var(--accent); font-size: 0.9rem; }
        .main-layout { display: grid; grid-template-columns: 1fr 300px; flex-grow: 1; overflow: hidden; }

        .sim-container { display: flex; flex-direction: column; height: 100%; border-right: 1px solid var(--border); }
        .sim-section { position: relative; flex: 1; overflow: hidden; border-bottom: 1px solid var(--border); background: #0d0d0d; }
        
        /* City Grid Layer - 75% Transparency */
        #nodeCanvas { position: absolute; top: 0; left: 0; z-index: 1; opacity: 0.75; } 
        
        /* Highway Layer */
        #highwayCanvas { position: absolute; top: 0; left: 0; z-index: 2; background: transparent; }

        .sim-label { 
            position: absolute; top: 10px; right: 10px; font-size: 0.6rem; 
            background: rgba(0,0,0,0.7); padding: 4px 8px; border: 1px solid var(--border);
            color: var(--accent); z-index: 30;
        }

        .data-panel { padding: 2rem; background: #080808; display: flex; flex-direction: column; gap: 1.5rem; }
        .metric-card { border-left: 2px solid var(--accent); padding-left: 15px; }
        .metric-label { font-size: 0.65rem; color: #666; margin-bottom: 5px; }
        .metric-value { font-size: 1.2rem; font-weight: bold; color: var(--accent); }

        .btn-container { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        .btn-action {
            padding: 15px; text-align: center; cursor: pointer; text-decoration: none; 
            font-weight: bold; font-size: 0.75rem; transition: all 0.3s ease; border: 1px solid var(--border);
        }
        .btn-reload { color: #666; border-color: #333; }
        .btn-reload:hover { background: #222; color: #fff; }
        .btn-game { border: 1px solid var(--accent); color: var(--accent); }
        .btn-game:hover { background: var(--accent); color: #000; }

        .overlay-ui {
            position: absolute; top: 15px; left: 15px; font-size: 0.55rem; 
            color: rgba(255,215,0,0.6); z-index: 20; line-height: 1.4;
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-title">CITYLOG // STARRY_GRID_v5.0</div>
        
        <div class="nav-menu">
            <a href="index.html" class="nav-link">Dashboard</a>
            <a href="ecosystem.html" class="nav-link">Ecosystem</a>
        </div>

        <div style="font-size: 0.7rem; color: #444;">SYNC_STATUS: ACTIVE</div>
    </nav>

    <div class="main-layout">
        <div class="sim-container">
            <div class="sim-section">
                <div class="sim-label">HIGHWAY_ODYSSEY // SPAN_VIEW</div>
                <div class="overlay-ui">NETWORK_NODES: 60<br>TOPOLOGY: SPACED<br>GRID_OPACITY: 0.75</div>
                <canvas id="nodeCanvas"></canvas>
                <canvas id="highwayCanvas"></canvas>
            </div>
        </div>

        <div class="data-panel">
            <div class="metric-card">
                <div class="metric-label">NETWORK TRAFFIC FLOW</div>
                <div class="metric-value" id="cong-val">MODERATE</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">SIMULATED DISTANCE</div>
                <div class="metric-value" id="dist-val">0.00 km</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">CHAOS COEFFICIENT</div>
                <div class="metric-value" id="chaos-val">0.82</div>
            </div>
            <div class="btn-container">
                <a href="game.html" class="btn-action btn-game">INITIATE_MANUAL_CONTROL (PLAY)</a>
                <a href="#" class="btn-action btn-reload" onclick="location.reload()">RE-INITIALIZE_SYSTEM</a>
            </div>
        </div>
    </div>

    <script>
        const nCanvas = document.getElementById('nodeCanvas');
        const hCanvas = document.getElementById('highwayCanvas');
        const nCtx = nCanvas.getContext('2d');
        const hCtx = hCanvas.getContext('2d');

        function resize() {
            nCanvas.width = nCanvas.parentElement.clientWidth;
            nCanvas.height = nCanvas.parentElement.clientHeight;
            hCanvas.width = hCanvas.parentElement.clientWidth;
            hCanvas.height = hCanvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let nodes = [];
        function initGrid() {
            nodes = [];
            for (let i = 0; i < 60; i++) {
                nodes.push({ 
                    x: Math.random() * nCanvas.width, 
                    y: Math.random() * nCanvas.height, 
                    connections: [], 
                    pulse: Math.random() * Math.PI * 2,
                    isStar: Math.random() > 0.8 
                });
            }
            nodes.forEach((n, i) => {
                nodes.forEach((m, j) => {
                    if (i < j) {
                        const d = Math.hypot(n.x - m.x, n.y - m.y);
                        if (d > 100 && d < 250 && Math.random() < 0.4) { 
                            n.connections.push(j); 
                        }
                    }
                });
            });
        }
        initGrid();

        function drawNodeMap() {
            nCtx.clearRect(0, 0, nCanvas.width, nCanvas.height);
            nodes.forEach((n) => {
                n.pulse += 0.03;
                n.connections.forEach(j => {
                    const m = nodes[j];
                    nCtx.strokeStyle = 'rgba(255, 215, 0, 0.2)';
                    nCtx.lineWidth = 0.8;
                    nCtx.beginPath(); nCtx.moveTo(n.x, n.y); nCtx.lineTo(m.x, m.y); nCtx.stroke();
                });

                if (n.isStar) {
                    const glow = Math.abs(Math.sin(n.pulse)) * 15;
                    nCtx.shadowBlur = glow;
                    nCtx.shadowColor = "white";
                    nCtx.fillStyle = `rgba(255, 255, 255, ${0.4 + Math.sin(n.pulse) * 0.4})`;
                    nCtx.beginPath(); nCtx.arc(n.x, n.y, 2.5, 0, Math.PI*2); nCtx.fill();
                    nCtx.shadowBlur = 0; 
                } else {
                    nCtx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                    nCtx.beginPath(); nCtx.arc(n.x, n.y, 1.5, 0, Math.PI*2); nCtx.fill();
                }
            });
            requestAnimationFrame(drawNodeMap);
        }

        let distance = 0, roadOffset = 0, speed = 8, entities = [];
        const trafficIcons = ['🚗', '🚙', '🚚', '🚧'];

        function spawnTraffic() {
            const lanes = [hCanvas.width/4, hCanvas.width/2, (hCanvas.width/4)*3];
            entities.push({ x: lanes[Math.floor(Math.random()*lanes.length)] - 20, y: -50, type: trafficIcons[Math.floor(Math.random()*trafficIcons.length)] });
            setTimeout(spawnTraffic, 1200);
        }

        function drawHighway() {
            hCtx.clearRect(0, 0, hCanvas.width, hCanvas.height);
            hCtx.fillStyle = '#0f0f0f';
            hCtx.fillRect(hCanvas.width/6, 0, (hCanvas.width/6)*4, hCanvas.height);

            hCtx.setLineDash([40, 60]); hCtx.lineDashOffset = -roadOffset; hCtx.strokeStyle = 'rgba(255,255,255,0.15)';
            hCtx.beginPath(); hCtx.moveTo(hCanvas.width/3, 0); hCtx.lineTo(hCanvas.width/3, hCanvas.height);
            hCtx.moveTo(hCanvas.width*2/3, 0); hCtx.lineTo(hCanvas.width*2/3, hCanvas.height); hCtx.stroke();

            hCtx.font = '30px Arial';
            entities.forEach((ent, i) => {
                ent.y += speed;
                hCtx.fillText(ent.type, ent.x, ent.y);
                if (ent.y > hCanvas.height + 50) entities.splice(i, 1);
            });

            hCtx.fillStyle = "#FFD700"; hCtx.fillRect(hCanvas.width/2 - 20, hCanvas.height - 100, 40, 60);

            roadOffset += speed; if (roadOffset > 100) roadOffset = 0;
            distance += 0.01;
            document.getElementById('dist-val').innerText = distance.toFixed(2) + " km";

            requestAnimationFrame(drawHighway);
        }

        drawNodeMap();
        spawnTraffic();
        drawHighway();
        window.addEventListener('resize', initGrid);
    </script>
</body>
</html>
